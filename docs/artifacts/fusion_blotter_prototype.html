<style>
/* ============================================================
   Fusion Blotter - high fidelity interactive prototype
   Direction A (Deep Terminal) neutrals + Direction B glass material.
   Committed single-theme dark: this is a trading terminal, and
   Direction C is the light variant kept as a separate design.
   ============================================================ */

/* ------------------------------------------------------------
   Palette.

   Every translucent value is a token, and every token is written
   out per theme rather than derived by re-alpha-ing one base.
   That is deliberate: a glass surface is NOT the same recipe in
   both themes. On dark it is a translucent DARK panel lifted by a
   light edge. On light it is frosted WHITE held down by a dark
   hairline. Flipping only the alpha would give a light theme full
   of muddy grey panels and invisible edges.

   Dark is the home theme, so the bare :root block is dark and the
   light overrides sit in the two blocks beneath it.
   ------------------------------------------------------------ */

:root {
  /* opaque grounds */
  --ground_deep: #060A12;
  --ground:      #0B111C;
  --surface:     #131C29;
  --sunk:        #0E1522;

  /* glass: translucent dark panel + light edge */
  --glass:            rgba(30, 42, 61, .55);
  --glass_soft:       rgba(30, 42, 61, .34);
  --glass_edge:       rgba(120, 200, 220, .22);
  --glass_edge_soft:  rgba(120, 200, 220, .11);
  --glass_shadow:     0 18px 44px -18px rgba(3, 8, 16, .92);
  --drawer_shadow:    -22px 0 54px -20px rgba(3, 8, 16, .95);

  /* near-opaque chrome fills */
  --bar_bg:       rgba(6, 10, 18, .72);
  --head_bg:      rgba(14, 21, 34, .94);
  --foot_bg:      rgba(10, 16, 26, .40);
  --scrim:        rgba(4, 8, 15, .68);
  --inp_focus_bg: rgba(18, 32, 46, .90);
  --avatar_bg:    rgba(18, 48, 60, .80);

  /* text ramp */
  --text:   #DCE4EE;
  --text_2: #9DB0CA;
  --muted:  #61748F;
  --faint:  #4E607A;

  /* brand */
  --brand:        #22D3EE;
  --brand_lo:     #67E8F9;
  --brand_hi:     #A5F3FC;
  --brand_bg:     rgba(34, 211, 238, .10);
  --brand_edge:   rgba(34, 211, 238, .32);
  --brand_ring:   rgba(34, 211, 238, .09);
  --brand_hover:  rgba(34, 211, 238, .045);
  --brand_glow:   rgba(34, 211, 238, .055);
  --brand_glow_2: rgba(34, 211, 238, .07);
  --brand_grad_hi: rgba(34, 211, 238, .24);
  --brand_grad_lo: rgba(34, 211, 238, .06);
  --brand_btn_hi: rgba(34, 211, 238, .22);
  --brand_btn_lo: rgba(34, 211, 238, .09);
  --brand_btn_hi2: rgba(34, 211, 238, .32);
  --brand_btn_lo2: rgba(34, 211, 238, .14);
  --brand_flash:  rgba(34, 211, 238, .20);

  /* semantics: softened for legibility through blur */
  --gain:          #46D4A0;
  --gain_bg:       rgba(70, 212, 160, .12);
  --gain_edge:     rgba(70, 212, 160, .26);
  --gain_edge_hi:  rgba(70, 212, 160, .38);
  --gain_flash:    rgba(70, 212, 160, .22);
  --gain_glow:     rgba(70, 212, 160, .045);

  --loss:           #F58598;
  --loss_hi:        #FDA4AF;
  --loss_bg:        rgba(245, 133, 152, .12);
  --loss_edge:      rgba(245, 133, 152, .26);
  --loss_edge_btn:  rgba(245, 133, 152, .30);
  --loss_edge_hi:   rgba(245, 133, 152, .38);
  --loss_edge_hot:  rgba(245, 133, 152, .50);
  --loss_invalid:   rgba(245, 133, 152, .55);
  --loss_flash:     rgba(245, 133, 152, .22);
  --loss_hot:       rgba(245, 133, 152, .20);

  --warn:          #FBBF24;
  --warn_bg:       rgba(251, 191, 36, .12);
  --warn_edge:     rgba(251, 191, 36, .30);
  --warn_edge_hi:  rgba(251, 191, 36, .34);

  --rule:      rgba(157, 176, 202, .12);
  --rule_soft: rgba(157, 176, 202, .07);

  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;

  --r: 7px;
  --row_h: 32px;

  color-scheme: dark;
}

/* ------------------------------------------------------------
   Light theme, sourced from Direction C (Institutional Light),
   not inverted from the dark values.

   Three things change role rather than value:
     glass       translucent dark  ->  frosted white
     glass_edge  light highlight   ->  dark hairline
     brand_lo    brighter cyan     ->  darker cyan
   Semantics go DARKER on light (emerald 700 / rose 700 / amber
   700) so they hold AA on white instead of washing out.
   ------------------------------------------------------------ */

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground_deep: #E8EDF4;
    --ground:      #F7FAFD;
    --surface:     #FFFFFF;
    --sunk:        #EDF1F6;

    --glass:            rgba(255, 255, 255, .72);
    --glass_soft:       rgba(255, 255, 255, .48);
    --glass_edge:       rgba(15, 27, 42, .11);
    --glass_edge_soft:  rgba(15, 27, 42, .05);
    --glass_shadow:     0 14px 34px -16px rgba(15, 27, 42, .20);
    --drawer_shadow:    -18px 0 44px -20px rgba(15, 27, 42, .18);

    --bar_bg:       rgba(247, 250, 253, .82);
    --head_bg:      rgba(247, 250, 253, .95);
    --foot_bg:      rgba(237, 241, 246, .55);
    --scrim:        rgba(203, 214, 228, .68);
    --inp_focus_bg: #FFFFFF;
    --avatar_bg:    #E4F4F8;

    --text:   #15212E;
    --text_2: #4A5D73;
    --muted:  #6B7A8D;
    --faint:  #7C8CA1;

    --brand:        #0891B2;
    --brand_lo:     #0E7490;
    --brand_hi:     #0E5A6E;
    --brand_bg:     rgba(8, 145, 178, .10);
    --brand_edge:   rgba(8, 145, 178, .30);
    --brand_ring:   rgba(8, 145, 178, .14);
    --brand_hover:  rgba(8, 145, 178, .06);
    --brand_glow:   rgba(8, 145, 178, .05);
    --brand_glow_2: rgba(8, 145, 178, .06);
    --brand_grad_hi: rgba(8, 145, 178, .18);
    --brand_grad_lo: rgba(8, 145, 178, .05);
    --brand_btn_hi: rgba(8, 145, 178, .15);
    --brand_btn_lo: rgba(8, 145, 178, .07);
    --brand_btn_hi2: rgba(8, 145, 178, .24);
    --brand_btn_lo2: rgba(8, 145, 178, .12);
    --brand_flash:  rgba(8, 145, 178, .15);

    --gain:          #047857;
    --gain_bg:       rgba(4, 120, 87, .10);
    --gain_edge:     rgba(4, 120, 87, .22);
    --gain_edge_hi:  rgba(4, 120, 87, .34);
    --gain_flash:    rgba(4, 120, 87, .16);
    --gain_glow:     rgba(4, 120, 87, .04);

    --loss:           #BE123C;
    --loss_hi:        #9F0F32;
    --loss_bg:        rgba(190, 18, 60, .09);
    --loss_edge:      rgba(190, 18, 60, .20);
    --loss_edge_btn:  rgba(190, 18, 60, .26);
    --loss_edge_hi:   rgba(190, 18, 60, .32);
    --loss_edge_hot:  rgba(190, 18, 60, .45);
    --loss_invalid:   rgba(190, 18, 60, .50);
    --loss_flash:     rgba(190, 18, 60, .15);
    --loss_hot:       rgba(190, 18, 60, .16);

    --warn:          #B45309;
    --warn_bg:       rgba(180, 83, 9, .11);
    --warn_edge:     rgba(180, 83, 9, .26);
    --warn_edge_hi:  rgba(180, 83, 9, .32);

    --rule:      rgba(15, 27, 42, .11);
    --rule_soft: rgba(15, 27, 42, .06);

    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --ground_deep: #E8EDF4;
  --ground:      #F7FAFD;
  --surface:     #FFFFFF;
  --sunk:        #EDF1F6;

  --glass:            rgba(255, 255, 255, .72);
  --glass_soft:       rgba(255, 255, 255, .48);
  --glass_edge:       rgba(15, 27, 42, .11);
  --glass_edge_soft:  rgba(15, 27, 42, .05);
  --glass_shadow:     0 14px 34px -16px rgba(15, 27, 42, .20);
  --drawer_shadow:    -18px 0 44px -20px rgba(15, 27, 42, .18);

  --bar_bg:       rgba(247, 250, 253, .82);
  --head_bg:      rgba(247, 250, 253, .95);
  --foot_bg:      rgba(237, 241, 246, .55);
  --scrim:        rgba(203, 214, 228, .68);

  --brand_bg:     rgba(8, 145, 178, .10);
  --brand_edge:   rgba(8, 145, 178, .30);
  --brand_ring:   rgba(8, 145, 178, .14);
  --brand_hover:  rgba(8, 145, 178, .06);
  --brand_glow:   rgba(8, 145, 178, .05);
  --brand_glow_2: rgba(8, 145, 178, .06);
  --brand_grad_hi: rgba(8, 145, 178, .18);
  --brand_grad_lo: rgba(8, 145, 178, .05);
  --brand_btn_hi: rgba(8, 145, 178, .15);
  --brand_btn_lo: rgba(8, 145, 178, .07);
  --brand_btn_hi2: rgba(8, 145, 178, .24);
  --brand_btn_lo2: rgba(8, 145, 178, .12);
  --brand_flash:  rgba(8, 145, 178, .15);

  --gain:          #047857;
  --gain_bg:       rgba(4, 120, 87, .10);
  --gain_edge:     rgba(4, 120, 87, .22);
  --gain_edge_hi:  rgba(4, 120, 87, .34);
  --gain_flash:    rgba(4, 120, 87, .16);
  --gain_glow:     rgba(4, 120, 87, .04);

  --loss:           #BE123C;
  --loss_hi:        #9F0F32;

  --loss_edge:      rgba(190, 18, 60, .20);
  --loss_edge_btn:  rgba(190, 18, 60, .26);
  --loss_edge_hi:   rgba(190, 18, 60, .32);
  --loss_edge_hot:  rgba(190, 18, 60, .45);

/* Explicit dark choice wins over a light OS setting. */
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground_deep);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

button {
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 3px;
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num  { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.up   { color: var(--gain); }
.down { color: var(--loss); }

/* ---------- page chrome around the device frame ---------- */

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 620px at 14% -12%, var(--brand_glow_2), transparent 62%),
    radial-gradient(900px 520px at 88% 4%, var(--gain_glow), transparent 58%),
    var(--ground_deep);
}

.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--rule);
  background: var(--bar_bg);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 40;
}

.bar_id {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-right: auto;
}

.bar_id b {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.bar_id span {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.seg {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 8px;
  background: var(--glass_soft);
  border: 1px solid var(--rule);
}

.seg button {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 11px;
  border-radius: 6px;
  transition: color .16s, background .16s;
  min-height: 30px;
}

.seg button:hover { color: var(--text_2); }

.seg button[aria-pressed="true"] {
  background: var(--brand_bg);
  color: var(--brand_lo);
  box-shadow: inset 0 0 0 1px var(--brand_edge);
}

.hint {
  font-size: 11.5px;
  color: var(--faint);
  max-width: 46ch;
}

/* ---------- device frame ---------- */

.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 20px 16px 34px;
  min-width: 0;
}

.device {
  container-type: inline-size;
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  overflow: hidden;
  background: var(--ground);
  border: 1px solid var(--rule);
  box-shadow: var(--glass_shadow);
  transition: max-width .3s cubic-bezier(.4, 0, .2, 1);
}

.device[data-w="desktop"] { max-width: 1440px; }
.device[data-w="tablet"]  { max-width: 834px; }
.device[data-w="phone"]   { max-width: 390px; }
.device[data-w="fit"]     { max-width: none; }

/* ---------- app shell ---------- */

.app {
  /* Positioning context for the tab bar, FAB, overlays and toasts, so they
     stay inside the device frame instead of anchoring to the page. */
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 760px;
  height: 82vh;
  max-height: 940px;
  min-width: 0;
  background:
    radial-gradient(760px 380px at 8% -8%, var(--brand_glow), transparent 60%),
    var(--ground);
}

.top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  height: 52px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(140%);
  box-shadow: inset 0 1px 0 var(--glass_edge_soft);
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}

.logo_mark {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--brand_grad_hi), var(--brand_grad_lo));
  box-shadow: inset 0 0 0 1px var(--brand_edge);
  color: var(--brand_lo);
}

.logo b {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -.012em;
  white-space: nowrap;
}

.nav {
  display: flex;
  gap: 3px;
  margin-left: 6px;
  min-width: 0;
}

.nav button {
  padding: 7px 13px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  transition: color .16s, background .16s;
}

.nav button:hover { color: var(--text_2); background: var(--glass_soft); }

.nav button[aria-current="page"] {
  color: var(--brand_lo);
  background: var(--brand_bg);
  box-shadow: inset 0 0 0 1px var(--brand_edge);
}

.top_end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}

.conn {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 27px;
  padding: 0 10px;
  border-radius: 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .07em;
  background: var(--brand_bg);
  box-shadow: inset 0 0 0 1px var(--brand_edge);
  color: var(--brand);
  white-space: nowrap;
}

.conn .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2.4s ease-in-out infinite;
}

.conn[data-state="reconnecting"] {
  background: var(--warn_bg);
  box-shadow: inset 0 0 0 1px var(--warn_edge_hi);
  color: var(--warn);
}

.conn[data-state="reconnecting"] .dot { animation: breathe 1.1s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .34; }
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .3; transform: scale(.7); }
}

.avatar {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--brand_lo);
  background: var(--avatar_bg);
  box-shadow: inset 0 0 0 1px var(--brand_edge);
}

.icon_btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: color .16s, background .16s;
}

.icon_btn:hover { color: var(--brand_lo); background: var(--glass_soft); }

/* ---------- KPI strip ---------- */

.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--rule_soft);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}

.kpi {
  background: var(--surface);
  padding: 11px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.kpi_lab {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kpi_val {
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.015em;
  line-height: 1.1;
}

.kpi_sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- body split ---------- */

.body {
  flex: 1;
  display: flex;
  min-height: 0;
  min-width: 0;
  position: relative;
}

.rail {
  width: 216px;
  flex-shrink: 0;
  border-right: 1px solid var(--rule);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  overflow-y: auto;
  background: var(--glass_soft);
}

.rail_head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.rail_head span {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
}

.clear {
  font-size: 11px;
  color: var(--brand);
  font-weight: 500;
}

.clear:hover { color: var(--brand_lo); text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 5px; }

.flab {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--faint);
}

.inp {
  height: 33px;
  padding: 0 10px;
  border-radius: var(--r);
  background: var(--sunk);
  border: 1px solid var(--rule);
  color: var(--text);
  font-size: 12.5px;
  width: 100%;
  min-width: 0;
  transition: border-color .16s, background .16s;
}

.inp::placeholder { color: var(--faint); }

.inp:focus {
  outline: none;
  border-color: var(--brand_edge);
  background: var(--inp_focus_bg);
  box-shadow: 0 0 0 3px var(--brand_ring);
}

select.inp {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 28px;
  cursor: pointer;
}

select.inp option { background: var(--surface); color: var(--text); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.tog {
  height: 33px;
  border-radius: var(--r);
  background: var(--sunk);
  border: 1px solid var(--rule);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: .06em;
  transition: all .16s;
}

.tog:hover { color: var(--text_2); }

.tog[aria-pressed="true"][data-v="BUY"] {
  background: var(--gain_bg);
  border-color: var(--gain_edge_hi);
  color: var(--gain);
}

};

const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const uid = () => "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0;
  return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
});

function nextTradeId() {
  return "TRD-" + (state.seq++);
}

/* ============================================================
   Seed. Shape matches the committed contract exactly:
   tradeId, symbol, side, quantity, price, trader, book,
   counterparty, tradeTimestamp, status, version.
   status stays two-valued. An amended trade carries version > 1.
   ============================================================ */

function roundTo(sym, price) {
  return Number(price.toFixed(price < 20 ? 3 : 2));
}

function seed(count) {
  const now = Date.now();
  for (const s of SYMBOLS) {
    state.marks[s.symbol] = s.ref;
    state.history[s.symbol] = Array.from({ length: 24 }, (_, i) =>
      roundTo(s, s.ref * (1 + (Math.sin(i / 3.1) * 0.004) + (Math.random() - 0.5) * 0.003))
    );
  }

  for (let i = 0; i < count; i++) {
    const s = pick(SYMBOLS);
    const ago = (count - i) * 42000 + rand(26000);
    const ts = new Date(now - ago);
    const drift = 1 + (Math.random() - 0.5) * 0.02;
    const trade = {
      id: uid(),
      tradeId: nextTradeId(),
      symbol: s.symbol,
      side: Math.random() > 0.47 ? "BUY" : "SELL",
      quantity: (rand(48) + 2) * 100,
      price: roundTo(s, s.ref * drift),
      trader: pick(TRADERS),
      book: s.book,
      counterparty: pick(COUNTERPARTIES),
      tradeTimestamp: ts.toISOString(),
      status: "ACTIVE",
      version: 1,
      createdAt: ts.toISOString(),
      updatedAt: ts.toISOString()
    };
    state.trades.push(trade);
    pushAudit("CREATE", trade, null, trade.trader, "Seed");
  }

  // A handful of amendments and cancellations so history is not empty.
  const pool = state.trades.slice(0, 40);
  for (let i = 0; i < 6; i++) {
    const t = pick(pool);
    if (t.version > 1 || t.status === "CANCELLED") continue;
    const before = { ...t };
    if (Math.random() > 0.5) t.quantity = Math.max(100, t.quantity + (rand(9) - 4) * 100);
    else t.price = roundTo(SYM_MAP.get(t.symbol), t.price * (1 + (Math.random() - 0.5) * 0.012));
    t.version += 1;
    t.updatedAt = new Date(Date.parse(t.tradeTimestamp) + 60000 + rand(400000)).toISOString();
    pushAudit("AMEND", t, before, pick(TRADERS), "Browser session");
  }
  for (let i = 0; i < 4; i++) {
    const t = pick(pool);
    if (t.status === "CANCELLED") continue;
    const before = { ...t };
    t.status = "CANCELLED";
    t.cancelReason = pick(CANCEL_REASONS);
    t.updatedAt = new Date(Date.parse(t.tradeTimestamp) + 90000 + rand(400000)).toISOString();
    pushAudit("CANCEL", t, before, pick(TRADERS), "Browser session");
  }
}

/* ============================================================
   Audit. One row per trade event, not only per amendment, which
   is what the design's CANCELLATIONS counter needs (audit D4/D5).
   ============================================================ */

function pushAudit(action, trade, before, actor, source) {
  const changes = {};
  if (before) {
    for (const k of ["symbol", "side", "quantity", "price", "trader", "book", "counterparty", "status"]) {
      if (before[k] !== trade[k]) changes[k] = { from: before[k], to: trade[k] };
    }
  }
  state.audit.unshift({
    id: uid(),
    tradeUuid: trade.id,
    tradeId: trade.tradeId,
    symbol: trade.symbol,
    version: trade.version,
    action,
    changes,
    reason: trade.cancelReason || null,
    amendedBy: actor,
    source: source || "Browser session",
    amendedAt: trade.updatedAt || new Date().toISOString()
  });
  if (state.audit.length > 400) state.audit.length = 400;
}

/* ============================================================
   Derivations
   ============================================================ */

function visibleTrades() {
  const f = state.filters;
  let rows = state.trades.filter(t =>
    (!f.symbol || t.symbol === f.symbol) &&
    (!f.side || t.side === f.side) &&
    (!f.status || t.status === f.status) &&
    (!f.trader || t.trader === f.trader) &&
    (!f.book || t.book === f.book)
  );
  const { by, dir } = state.sort;
  const mul = dir === "asc" ? 1 : -1;
  rows.sort((a, b) => {
    let x = a[by], y = b[by];
    if (by === "notional") { x = a.quantity * a.price; y = b.quantity * b.price; }
    if (typeof x === "number") return (x - y) * mul;
    return String(x).localeCompare(String(y)) * mul;
  });
  return rows;
}

/**
 * Average-cost position book. Realised P&L accrues when a trade closes
 * against an opposing position; unrealised is marked against the live feed.
 */
function positions() {
  const map = new Map();
  const ordered = state.trades
    .filter(t => t.status === "ACTIVE")
    .slice()
    .sort((a, b) => a.tradeTimestamp.localeCompare(b.tradeTimestamp));

  for (const t of ordered) {
    let p = map.get(t.symbol);
    if (!p) {
      p = { symbol: t.symbol, netQty: 0, avg: 0, realised: 0, count: 0, buy: 0, sell: 0, book: t.book };
      map.set(t.symbol, p);
    }
    p.count++;
    if (t.side === "BUY") p.buy += t.quantity; else p.sell += t.quantity;

    const signed = t.side === "BUY" ? t.quantity : -t.quantity;

    if (p.netQty === 0) {
      p.avg = t.price;
      p.netQty = signed;
    } else if (Math.sign(p.netQty) === Math.sign(signed)) {
      const abs = Math.abs(p.netQty);
      p.avg = (abs * p.avg + t.quantity * t.price) / (abs + t.quantity);
      p.netQty += signed;
    } else {
      const closeQty = Math.min(t.quantity, Math.abs(p.netQty));
      p.realised += (t.price - p.avg) * closeQty * Math.sign(p.netQty);
      const before = p.netQty;
      p.netQty += signed;
      if (p.netQty === 0) p.avg = 0;
      else if (Math.sign(p.netQty) !== Math.sign(before)) p.avg = t.price;
    }
  }

  return [...map.values()].map(p => {
    const mark = state.marks[p.symbol] ?? p.avg;
    const unrealised = p.netQty === 0 ? 0 : (mark - p.avg) * p.netQty;
    return { ...p, mark, unrealised, netNotional: p.netQty * mark, pnl: unrealised + p.realised };
  }).sort((a, b) => Math.abs(b.netNotional) - Math.abs(a.netNotional));
}

function totals() {
  const pos = positions();
  const active = state.trades.filter(t => t.status === "ACTIVE");
  return {
    net: pos.reduce((s, p) => s + p.netNotional, 0),
    pnl: pos.reduce((s, p) => s + p.pnl, 0),
    unrealised: pos.reduce((s, p) => s + p.unrealised, 0),
    realised: pos.reduce((s, p) => s + p.realised, 0),
    gross: pos.reduce((s, p) => s + Math.abs(p.netNotional), 0),
    count: active.length,
    cancelled: state.trades.length - active.length,
    symbols: pos.length
  };
}

/* ============================================================
   Formatting
   ============================================================ */

const fmtQty = (n) => n.toLocaleString("en-GB");
const fmtPx = (n) => n.toLocaleString("en-GB", { minimumFractionDigits: n < 20 ? 3 : 2, maximumFractionDigits: n < 20 ? 3 : 2 });

function fmtMoney(n, dp = 0) {
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "M";
  if (a >= 1e3 && dp === 0) return Math.round(n).toLocaleString("en-GB");
  return n.toLocaleString("en-GB", { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

const signed = (n) => (n >= 0 ? "+" : "\u2212") + fmtMoney(Math.abs(n));
const clockOf = (iso) => new Date(iso).toISOString().slice(11, 19);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ============================================================
   Simulation: a mark feed the P&L view can actually read from,
   plus trades arriving from other desks.
   ============================================================ */

let markTimer = null, tradeTimer = null;

function stepMarks() {
  if (!state.feed || state.connection !== "live") return;
  for (const s of SYMBOLS) {
    const cur = state.marks[s.symbol];
    const vol = s.ref < 20 ? 0.0018 : 0.0011;
    const next = roundTo(s, Math.max(0.01, cur * (1 + (Math.random() - 0.5) * 2 * vol)));
    state.marks[s.symbol] = next;
    const h = state.history[s.symbol];
    h.push(next);
    if (h.length > 24) h.shift();
  }
  state.latency = 9 + rand(18);
  if (state.view === "blotter") paintLiveBits();
  if (state.view === "positions") render();
}

function incomingTrade() {
  if (!state.feed || state.connection !== "live") return;
  const s = pick(SYMBOLS);
  const mark = state.marks[s.symbol];
  const now = new Date().toISOString();
  const t = {
    id: uid(),
    tradeId: nextTradeId(),
    symbol: s.symbol,
    side: Math.random() > 0.5 ? "BUY" : "SELL",
    quantity: (rand(30) + 2) * 100,
    price: roundTo(s, mark * (1 + (Math.random() - 0.5) * 0.002)),
    trader: pick(TRADERS.filter(x => x !== state.user)),
    book: s.book,
    counterparty: pick(COUNTERPARTIES),
    tradeTimestamp: now,
    status: "ACTIVE",
    version: 1,
    createdAt: now,
    updatedAt: now
  };
  state.trades.push(t);
  pushAudit("CREATE", t, null, t.trader, "API");
  state.flashes.set(t.id, "new");
  render();
  setTimeout(() => { state.flashes.delete(t.id); }, 1600);
  scheduleTrade();
}

function scheduleTrade() {
  clearTimeout(tradeTimer);
  tradeTimer = setTimeout(incomingTrade, 6000 + rand(6000));
}

function startFeed() {
  clearInterval(markTimer);
  markTimer = setInterval(stepMarks, 900);
  scheduleTrade();
}

function dropLink() {
  if (state.connection !== "live") return;
  state.connection = "reconnecting";
  state.queued = 0;
  render();
  const queueTimer = setInterval(() => { state.queued++; paintLiveBits(); }, 1100);
  setTimeout(() => {
    clearInterval(queueTimer);
    state.connection = "live";
    const caught = state.queued;
    for (let i = 0; i < caught; i++) {
      const s = pick(SYMBOLS);
      const now = new Date().toISOString();
      const t = {
        id: uid(), tradeId: nextTradeId(), symbol: s.symbol,
        side: Math.random() > 0.5 ? "BUY" : "SELL",
        quantity: (rand(24) + 2) * 100,
        price: roundTo(s, state.marks[s.symbol] * (1 + (Math.random() - 0.5) * 0.003)),
        trader: pick(TRADERS), book: s.book, counterparty: pick(COUNTERPARTIES),
        tradeTimestamp: now, status: "ACTIVE", version: 1, createdAt: now, updatedAt: now
      };
      state.trades.push(t);
      pushAudit("CREATE", t, null, t.trader, "API");
      state.flashes.set(t.id, "new");
    }
    setTimeout(() => state.flashes.clear(), 1600);
    toast("ok", "Reconnected", caught + " trade" + (caught === 1 ? "" : "s") + " caught up");
    render();
  }, 5200);
}

const toastQueue = [];

function toast(kind, title, detail) {
  toastQueue.push({ id: uid(), kind, title, detail });
  paintToasts();
  setTimeout(() => { toastQueue.shift(); paintToasts(); }, 4200);
}

function paintToasts() {
  const host = document.getElementById("toasts");
  if (!host) return;
  host.innerHTML = toastQueue.map(t => `
    <div class="toast" data-k="${t.kind}">
      <b>${esc(t.title)}</b>
      <span style="color:var(--muted)">${esc(t.detail || "")}</span>
    </div>`).join("");
}

    ? `<span class="ver" title="Amended ${t.version - 1} time${t.version > 2 ? "s" : ""}. Amendment is a version, not a status.">v${t.version}</span>`
    : "";
  return `<div class="status_cell">${st}${ver}</div>`;
}

function tickMark(t) {
  const mark = state.marks[t.symbol];
  if (mark == null) return "";
  if (mark > t.price) return '<span class="tick up">&#9650;</span>';
  if (mark < t.price) return '<span class="tick down">&#9660;</span>';
  return '<span class="tick"></span>';
}

function histRow(a) {
  const verb = { CREATE: "booked", AMEND: "amended", CANCEL: "cancelled" }[a.action];
  const deltas = Object.entries(a.changes || {})
    .filter(([k]) => k !== "status")
    .map(([k, v]) => `<span>${k}</span> <s>${esc(v.from)}</s> <i>${esc(v.to)}</i>`)
    .join(" &middot; ");
  return `<div class="hist_row">
    <div class="hist_dot" data-a="${a.action}"></div>
    <div class="hist_main">
      <div class="hist_t"><b>${a.amendedBy}</b> ${verb}${a.reason ? ` &middot; ${esc(a.reason)}` : ""}</div>
      ${deltas ? `<div class="delta">${deltas}</div>` : ""}
      <div class="hist_m">${clockOf(a.amendedAt)} &middot; ${esc(a.source)} &middot; v${a.version}</div>
    </div>
  </div>`;
}

function sparkline(hist, gain) {
  if (!hist || hist.length < 2) return "";
  const w = 96, h = 22, pad = 2;
  const min = Math.min(...hist), max = Math.max(...hist);
  const span = (max - min) || 1;
  const pts = hist.map((v, i) => {
    const x = pad + (i / (hist.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / span) * (h - pad * 2);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const c = gain ? "var(--gain)" : "var(--loss)";
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="1.9" fill="${c}"/>
  </svg>`;
}

function paintLiveBits() {
  const conn = document.querySelector(".conn");
  if (conn) {
    conn.dataset.state = state.connection;
    conn.innerHTML = state.connection === "live"
      ? `<span class="dot"></span>LIVE <span class="mono" style="color:var(--brand_lo)">${state.latency}ms</span>`

    if (cell) cell.innerHTML = fmtPx(t.price) + tickMark(t);

/* ============================================================
   Validation, mirroring the committed zod schema
   ============================================================ */

function readForm() {
  const q = Number(document.getElementById("f_qty").value);
  const p = Number(document.getElementById("f_px").value);
  const errs = {};
  if (!Number.isInteger(q) || q <= 0) errs.f_qty = "Quantity must be a positive whole number";
  else if (q > 10000000) errs.f_qty = "Quantity exceeds the 10,000,000 limit";
  if (!(p > 0)) errs.f_px = "Price must be positive";
  else if (p > 1000000) errs.f_px = "Price exceeds the 1,000,000 limit";
  const side = document.getElementById("side_buy").getAttribute("aria-pressed") === "true" ? "BUY" : "SELL";
  return {
    errs,
    value: {
      symbol: document.getElementById("f_sym").value,
      side,
      quantity: q,
      price: p,
      trader: document.getElementById("f_trader").value,
      book: document.getElementById("f_book").value,
      counterparty: document.getElementById("f_cpty").value
    }
  };
}

function showErrors(errs) {
  for (const id of ["f_qty", "f_px"]) {
    const el = document.getElementById(id);
    const box = document.getElementById(id + "_err");
    if (!el || !box) continue;
    if (errs[id]) { el.setAttribute("aria-invalid", "true"); box.textContent = errs[id]; }
    else { el.removeAttribute("aria-invalid"); box.textContent = ""; }
  }
}

/* ------------------------------------------------------------
   Theme. Three real states, because the artifact host can stamp
   data-theme itself: "system" removes our stamp and lets
   prefers-color-scheme decide, the other two pin it.
   ------------------------------------------------------------ */

const THEME_KEY = "fusion_blotter_theme";

function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", mode);
  document.querySelectorAll("[data-theme-set]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));
  try { localStorage.setItem(THEME_KEY, mode); } catch (err) { /* private mode */ }
}

function initTheme() {
  let mode = "system";
  try { mode = localStorage.getItem(THEME_KEY) || "system"; } catch (err) { /* private mode */ }
  if (!["system", "light", "dark"].includes(mode)) mode = "system";
  applyTheme(mode);
}

document.addEventListener("click", (e) => {
  const hit = (sel) => e.target.closest(sel);

  const themeBtn = hit("[data-theme-set]");
  if (themeBtn) { applyTheme(themeBtn.dataset.themeSet); return; }

  const dev = hit("[data-dev]");
  if (dev) {
    document.getElementById("device").dataset.w = dev.dataset.dev;
    document.querySelectorAll("[data-dev]").forEach(b => b.setAttribute("aria-pressed", String(b === dev)));
    return;
  }

  if (hit("#sim_toggle")) {
    state.feed = !state.feed;
    const b = document.getElementById("sim_toggle");
    b.setAttribute("aria-pressed", String(state.feed));
    b.textContent = state.feed ? "Feed on" : "Feed off";
    if (state.feed) scheduleTrade();
    return;
  }

  if (hit("#sim_drop")) { dropLink(); return; }

  if (hit("#do_login")) {
    state.user = document.getElementById("login_code").value;
    state.authed = true;
    render();
    toast("ok", "Signed in", "as " + state.user);
    return;
  }

  if (hit("#who")) { state.authed = false; state.overlay = null; render(); return; }

  const navBtn = hit("[data-view]");
  if (navBtn) {
    const v = navBtn.dataset.view;
    state.view = v === "profile" ? "audit" : v;
    state.overlay = null;
    render();
    return;
  }

  const sortBtn = hit("[data-sort]");
  if (sortBtn) {
    const k = sortBtn.dataset.sort;
    if (state.sort.by === k) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
    else { state.sort.by = k; state.sort.dir = k === "tradeTimestamp" ? "desc" : "asc"; }
    render();
    return;
  }

  const sideTog = hit("[data-side]");
  if (sideTog) {
    state.filters.side = state.filters.side === sideTog.dataset.side ? "" : sideTog.dataset.side;
    render();
    return;
  }

  const statTog = hit("[data-status]");
  if (statTog) {
    state.filters.status = state.filters.status === statTog.dataset.status ? "" : statTog.dataset.status;
    render();
    return;
  }

  const unchip = hit("[data-unchip]");
  if (unchip) { state.filters[unchip.dataset.unchip] = ""; render(); return; }

  if (hit("#clear_filters")) {
    state.filters = { symbol: "", side: "", status: "", trader: "", book: "" };
    render();
    return;
  }

  if (hit("#tool_refresh")) {
    render();
    toast("ok", "Refreshed", visibleTrades().length + " rows from the API");
    return;
  }

  if (hit("#tool_new") || hit("#rail_new") || hit("#fab_new")) { state.overlay = "new"; render(); return; }
  if (hit("#act_amend")) { state.overlay = "amend"; render(); return; }
  if (hit("#act_cancel")) { state.overlay = "cancel"; render(); return; }
  if (hit("#drawer_close")) { state.selected = null; render(); return; }

  const sideBtn = hit("#side_buy, #side_sell");
  if (sideBtn) {
    document.getElementById("side_buy").setAttribute("aria-pressed", String(sideBtn.id === "side_buy"));
    document.getElementById("side_sell").setAttribute("aria-pressed", String(sideBtn.id === "side_sell"));
    return;
  }

  if (hit("#submit_trade")) { submitTrade(); return; }
  if (hit("#confirm_cancel")) { confirmCancel(); return; }

  if (hit("[data-close]") || (hit("[data-scrim]") && e.target.classList.contains("scrim"))) {
    state.overlay = null;
    render();
    return;
  }

  const goto = hit("[data-goto]");
  if (goto) {
    state.selected = goto.dataset.goto;
    state.view = "blotter";
    render();
    return;
  }

  const row = hit(".grow, .card");
  if (row) {
    state.selected = state.selected === row.dataset.id ? null : row.dataset.id;
    render();
  }
});

document.addEventListener("change", (e) => {
  const f = e.target.closest("[data-f]");
  if (f) { state.filters[f.dataset.f] = f.value; render(); return; }

  if (e.target.id === "f_sym") {
    const mark = state.marks[e.target.value];
    const ms = document.getElementById("mark_sym"), mv = document.getElementById("mark_val");
    if (ms) ms.textContent = e.target.value;
    if (mv) mv.textContent = mark != null ? fmtPx(mark) : "\u2013";
    const bk = document.getElementById("f_book");
    if (bk) bk.value = SYM_MAP.get(e.target.value).book;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.overlay) { state.overlay = null; render(); }
    else if (state.selected) { state.selected = null; render(); }
  }
  if (e.key === "Enter" && e.target.closest(".grow, .card")) {
    e.target.click();
  }
});

function submitTrade() {
  const { errs, value } = readForm();
  showErrors(errs);
  if (Object.keys(errs).length) {
    toast("err", "Not saved", Object.values(errs)[0]);
    return;
  }
  const now = new Date().toISOString();

  if (state.overlay === "amend") {
    const t = state.trades.find(x => x.id === state.selected);
    if (!t) return;
    const before = { ...t };
    Object.assign(t, value);
    t.version += 1;
    t.updatedAt = now;
    pushAudit("AMEND", t, before, state.user, "Browser session");
    state.overlay = null;
    state.flashes.set(t.id, "up");
    render();
    setTimeout(() => { state.flashes.delete(t.id); }, 1400);
    toast("ok", "Amended " + t.tradeId, "now version " + t.version);
    return;
  }

  const t = {
    id: uid(),
    tradeId: nextTradeId(),
    ...value,
    tradeTimestamp: now,
    status: "ACTIVE",
    version: 1,
    createdAt: now,
    updatedAt: now
  };
  state.trades.push(t);
  pushAudit("CREATE", t, null, state.user, "Browser session");
  state.overlay = null;
  state.selected = t.id;
  state.flashes.set(t.id, "new");
  state.sort = { by: "tradeTimestamp", dir: "desc" };
  render();
  setTimeout(() => { state.flashes.delete(t.id); }, 1600);
  toast("ok", "Booked " + t.tradeId, fmtQty(t.quantity) + " " + t.symbol + " @ " + fmtPx(t.price));
}

function confirmCancel() {
  const sel = document.getElementById("cancel_reason");
  const box = document.getElementById("cancel_reason_err");
  if (!sel.value) {
    sel.setAttribute("aria-invalid", "true");
    box.textContent = "Pick a reason before cancelling";
    return;
  }
  const t = state.trades.find(x => x.id === state.selected);
  if (!t) return;
  const before = { ...t };
  t.status = "CANCELLED";
  t.cancelReason = sel.value;
  t.updatedAt = new Date().toISOString();
  pushAudit("CANCEL", t, before, state.user, "Browser session");
  state.overlay = null;
  render();
  toast("warn", "Cancelled " + t.tradeId, sel.value);
}

/* ============================================================
   Boot
   ============================================================ */

initTheme();
seed(58);
render();
startFeed();
</script>
