name: ci

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the run still in flight, so CI reports on the head
# commit rather than queueing behind work that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: build and test the .NET services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Blotter.slnx

      # Warnings are errors in every project, so this step is also the analyzer and style gate.
      - name: Build
        run: dotnet build Blotter.slnx --configuration Release --no-restore

      # The integration tiers start real SQL Server, RabbitMQ and Redis containers through
      # Testcontainers on the runner's own Docker, so nothing here is mocked.
      - name: Test
        run: dotnet test --solution Blotter.slnx --configuration Release --no-build

  contract:
    name: validation parity with the shared schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the shared contract
        run: npm run build:shared

      # The gateway's validators are tested against this fixture. If someone changes a Zod schema
      # in the shared package without regenerating it, the .NET API would drift from the frontend.
      - name: Check the Zod fixture is current
        run: node scripts/export_zod_cases.mjs --check

  frontend:
    name: frontend typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the shared contract
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Unit tests
        run: npm test --workspace frontend

  images:
    name: build and scan the ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: services/gateway/Dockerfile
            gate: '1'
          - image: trades
            dockerfile: services/trades/Dockerfile
            gate: '1'
          - image: realtime
            dockerfile: services/realtime/Dockerfile
            gate: '1'
          # Reported but not yet gating: the web app's Next.js version has published advisories
          # whose fix is a framework upgrade, which is its own change.
          - image: frontend
            dockerfile: frontend/Dockerfile
            gate: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: blotter/${{ matrix.image }}:ci
          load: true
          push: false

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: blotter/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ matrix.gate }}

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: whole stack in compose, with the browser suite
    runs-on: ubuntu-latest
    needs: [services, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same one command a deployment runs, with the development secrets compose falls back to.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser suite against the nginx edge
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
