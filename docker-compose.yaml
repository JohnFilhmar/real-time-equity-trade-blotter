name: tp-icap-blotter

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blotter}
      POSTGRES_DB: ${POSTGRES_DB:-blotter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - blotter
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-blotter} -d ${POSTGRES_DB:-blotter}
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence. Redis holds sessions and rate-limit counters, both of which are allowed to be
    # lost on a restart: everyone signs in again. Persisting them would mean a disk full of
    # credentials-adjacent state for no gain.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # The image's entrypoint starts as root and uses setpriv to drop to the redis user, which needs
    # the SETUID and SETGID capabilities that cap_drop removes. Starting as the redis user skips that
    # step entirely, so the container never runs as root and keeps every capability dropped. Found
    # by running the stack: the container crash-looped on "setresuid failed" and never got healthy.
    user: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - blotter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Migrations run once, to completion, before the API starts. Keeping them out of the API's own
  # start command is what lets node be PID 1 there and handle SIGTERM, and it means a failed
  # migration stops the rollout instead of crash-looping the API.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    image: tp-icap/backend:local
    pull_policy: build
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-blotter}:${POSTGRES_PASSWORD:-blotter}@database:5432/${POSTGRES_DB:-blotter}?schema=public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - blotter
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    image: tp-icap/backend:local
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-blotter}:${POSTGRES_PASSWORD:-blotter}@database:5432/${POSTGRES_DB:-blotter}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      # Development secrets, and obviously so. A real deployment supplies these from a secret store
      # and never from a compose file; the env schema refuses anything under 32 characters, which is
      # what stops a placeholder from quietly becoming the production key.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-0123456789abcdef}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-blotter-demo-2026}
      SEED_ON_STARTUP: "true"
      SEED_TRADE_COUNT: "500"
      LIVE_FEED_ENABLED: ${LIVE_FEED_ENABLED:-true}
      LIVE_FEED_MIN_INTERVAL_MS: ${LIVE_FEED_MIN_INTERVAL_MS:-3000}
      LIVE_FEED_MAX_INTERVAL_MS: ${LIVE_FEED_MAX_INTERVAL_MS:-8000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - blotter
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    image: tp-icap/frontend:local
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      # The browser talks to the API directly, for HTTP and for the socket, so this is the only
      # address the web app needs. It is baked in at build time, which is why the Dockerfile reads
      # it as a build argument as well.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blotter
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  blotter:
    driver: bridge

volumes:
  database_data:
